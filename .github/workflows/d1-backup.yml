# Weekly D1 backup (RL-470). Inert until the two secrets exist:
#   CLOUDFLARE_API_TOKEN  — API token with "D1: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — account id (dashboard → right sidebar)
# The dump is kept as a workflow artifact for 90 days. R2 photos are
# deliberately NOT backed up (12-month retention, replaceable evidence).
name: d1-backup

on:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Export D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Secrets not configured — skipping (inert by design)."; exit 0
          fi
          npx wrangler@latest d1 export restorelab-orders --remote \
            --output "restorelab-orders-$(date +%F).sql"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('restorelab-orders-*.sql') != '' }}
        with:
          name: d1-backup-${{ github.run_id }}
          path: restorelab-orders-*.sql
          retention-days: 90
